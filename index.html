<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="iPhone">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>iPhone</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html { margin: 0; overflow-x: hidden; background-color: #000; background-repeat: no-repeat; overscroll-behavior: none; }
  body { margin: 0; overflow-x: hidden; width: 100%; min-height: 100vh; min-height: 100lvh; background: transparent; overscroll-behavior: none; touch-action: manipulation; font-family: -apple-system, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif; color: #fff; }
  #probe { position: fixed; left: 0; top: 0; width: 1px; height: 100vh; height: 100lvh; visibility: hidden; pointer-events: none; }
  /* el documento es 2px más alto que la pantalla (como las demás webs, que "se pueden deslizar") */
  #spacer { height: 100vh; height: calc(100lvh + 2px); width: 1px; }

  #app { position: absolute; left: 0; top: 0; width: 100%; height: var(--vh); overflow-x: clip; overflow-y: visible; --u: .3333px; --vh: 100px; --wh: 100px; --vhu: 2556; --ease: cubic-bezier(.22,1.35,.4,1); }
  #wall { position: absolute; left: 0; top: 0; width: 100%; height: var(--wh); background-repeat: no-repeat; background-color: #0b0d0a; }
  #dim { position: absolute; left: 0; top: 0; width: 100%; height: var(--wh); background: #000; opacity: .42; transition: opacity .7s ease; pointer-events: none; }
  #app.unlocked #dim { opacity: .1; }

  .abs { position: absolute; }
  /* ===== HOME ===== */
  #home { position: absolute; inset: 0; visibility: hidden; }
  #app.unlocked #home { visibility: visible; }
  .fly { opacity: 0; }
  #app.unlocked .fly { animation: fly .95s var(--ease) both; animation-delay: var(--d, 0s); }
  @keyframes fly {
    0%   { opacity: 0; transform: scale(1.5); filter: blur(10px); }
    35%  { opacity: 1; filter: blur(2px); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  .app { position: absolute; width: calc(var(--u) * 192); height: calc(var(--u) * 192); }
  .app img.ic { width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
  .lab { position: absolute; left: 50%; white-space: nowrap; transform: translate(-50%, -50%); font-weight: 500; font-size: calc(var(--u) * 36); line-height: 1; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.5); pointer-events: none; }
  .widget { position: absolute; width: calc(var(--u) * 486); height: calc(var(--u) * 486); }
  .widget img { width: 100%; height: 100%; display: block; pointer-events: none; }
  .badge { position: absolute; background: #ff3b30; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 500; line-height: 1; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .dock { position: absolute; left: calc(var(--u) * 40); width: calc(var(--u) * 1100); height: calc(var(--u) * 325); top: calc(var(--vh) - var(--u) * 361);
          border-radius: calc(var(--u) * 105); background: rgba(40,44,38,.38); -webkit-backdrop-filter: blur(calc(var(--u) * 26)) saturate(1.5); backdrop-filter: blur(calc(var(--u) * 26)) saturate(1.5);
          border: 1px solid rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
  .search { position: absolute; left: calc(var(--u) * 447); width: calc(var(--u) * 286); height: calc(var(--u) * 86); top: calc(var(--vh) - var(--u) * 506);
            border-radius: 999px; background: rgba(30,32,28,.55); -webkit-backdrop-filter: blur(calc(var(--u) * 20)); backdrop-filter: blur(calc(var(--u) * 20));
            display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 14); font-size: calc(var(--u) * 42); font-weight: 500; color: rgba(255,255,255,.82); border: 1px solid rgba(255,255,255,.1); }
  .search svg { width: calc(var(--u) * 38); height: calc(var(--u) * 38); }

  /* ===== BLOQUEO ===== */
  #lockui { position: absolute; inset: 0; transition: opacity .38s cubic-bezier(.3,0,.2,1), transform .55s cubic-bezier(.2,.8,.2,1), filter .38s ease-out; }
  #app.unlocked #lockui { opacity: 0; transform: scale(1.06); filter: blur(6px); pointer-events: none; }
  #app.relock #lockui, #app.relock #dim, #app.relock .fly { transition: none !important; animation: none !important; }
  .title { position: absolute; left: 0; width: 100%; top: calc(var(--u) * 495); transform: translateY(-50%); text-align: center; font-size: calc(var(--u) * 57); font-weight: 400; line-height: 1; text-shadow: 0 1px 6px rgba(0,0,0,.35); white-space: nowrap; }
  #dots { position: absolute; inset: 0; pointer-events: none; }
  #dots.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake { 10%,90% { transform: translateX(-1.2%); } 20%,80% { transform: translateX(2.4%); } 30%,50%,70% { transform: translateX(-3.6%); } 40%,60% { transform: translateX(3.6%); } }
  .dot { position: absolute; width: calc(var(--u) * 40); height: calc(var(--u) * 40); border-radius: 50%; border: calc(var(--u) * 4) solid #fff; transform: translate(-50%, -50%); transition: background .1s, transform .2s cubic-bezier(.3,1.6,.5,1); }
  .dot.on { background: #fff; transform: translate(-50%, -50%) scale(1.06); }
  .key { position: absolute; width: calc(var(--u) * 230); height: calc(var(--u) * 230); transform: translate(-50%, -50%); border-radius: 50%; border: 0; padding: 0; color: #fff; cursor: pointer; font-family: inherit;
         background: radial-gradient(circle at 32% 24%, rgba(255,255,255,.30) 0%, rgba(255,255,255,.07) 55%, rgba(255,255,255,.10) 100%);
         -webkit-backdrop-filter: blur(calc(var(--u) * 12)) saturate(1.5) brightness(1.15); backdrop-filter: blur(calc(var(--u) * 12)) saturate(1.5) brightness(1.15);
         box-shadow: inset 0 0 0 calc(var(--u) * 3) rgba(255,255,255,.24), inset 0 calc(var(--u) * -10) calc(var(--u) * 22) rgba(255,255,255,.10), 0 calc(var(--u) * 6) calc(var(--u) * 20) rgba(0,0,0,.18);
         transition: background .4s ease, transform .45s cubic-bezier(.3,1.6,.5,1); }
  .key:active { background: rgba(255,255,255,.42); transform: translate(-50%, -50%) scale(.97); transition: background 0s, transform .08s; }
  .key .n { position: absolute; left: 0; right: 0; text-align: center; font-size: calc(var(--u) * 114); font-weight: 300; line-height: 1; top: 50%; transform: translateY(-62%); pointer-events: none; }
  .key .l { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 36); text-align: center; font-size: calc(var(--u) * 31); font-weight: 700; letter-spacing: .26em; padding-left: .26em; line-height: 1; pointer-events: none; }
  .key.z .n { transform: translateY(-50%); }
  .btm { position: absolute; top: calc(var(--vh) - var(--u) * 203); transform: translate(-50%, -50%); font-size: calc(var(--u) * 50); line-height: 1; text-shadow: 0 1px 4px rgba(0,0,0,.4); }
  #reset { position: absolute; left: 0; top: 0; width: 30%; height: calc(var(--u) * 190); z-index: 9; }
</style>
</head>

</div>

  home.appendChild(el('dock fly', '', `--d:.1s;transform-origin:50% 0`));
  DOCK.forEach(([id, cx], i) => {
    const a = el('app fly', img('ic_' + id), `left:${U(cx - 96)};top:calc(var(--vh) - var(--u) * 295);--d:${0.16 + i * .03}s;transform-origin: calc(var(--u) * ${590 - (cx - 96)}) calc(var(--u) * -400)`);
    if (id === 'whatsapp') a.appendChild(el('badge', '4', `left:${U(145)};top:${U(-34)};width:${U(80)};height:${U(80)};border-radius:50%;font-size:${U(46)}`));
    home.appendChild(a);
  });
}

// Teclado y puntos
const keysBox = $('#keys'), dotsBox = $('#dots');
KEYS.forEach(([d, letters, x, y]) => {
  const b = document.createElement('button');
  b.className = 'key' + (d === 0 ? ' z' : ''); b.setAttribute('aria-label', d);
  b.style.left = U(x); b.style.top = U(y);
  b.innerHTML = `<span class="n">${d}</span>` + (letters ? `<span class="l">${letters}</span>` : '');
  b.addEventListener('pointerdown', e => { e.preventDefault(); press(String(d)); });
  keysBox.appendChild(b);
});
const dotEls = DOTS_X.map(x => { const d = el('dot', '', `left:${U(x)};top:${U(DOTS_Y)}`); dotsBox.appendChild(d); return d; });
const renderDots = () => dotEls.forEach((d, i) => d.classList.toggle('on', i < entry.length));

/* ============ AJUSTE A PANTALLA ============ */
function isStandalone() { return window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
let healCount = 0;
function heal() {
  healCount++;
  const de = document.documentElement;
  de.style.display = 'none'; void de.offsetHeight; de.style.display = '';
  const m = document.querySelector('meta[name=viewport]');
  if (m) { const c = m.content; m.content = 'width=device-width, initial-scale=1'; void de.offsetHeight; m.content = c; }
  window.scrollTo(0, 0);
}
function needsHeal() {
  if (!(navigator.maxTouchPoints > 0) || !window.screen) return false;
  const sh = Math.max(screen.height, screen.width);
  return window.innerHeight >= window.innerWidth && sh - window.innerHeight > 4 && sh - window.innerHeight <= 160;
}
function tryHeal() { if (needsHeal() && healCount < 6) { heal(); setTimeout(fit, 80); } }

function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let wh = Math.max(vh, $('#probe').offsetHeight);
  if (navigator.maxTouchPoints > 0 && window.screen) { const sh = Math.max(screen.height, screen.width); if (sh >= wh && sh - wh <= 160) wh = sh; }
  const u = vw / 1179;
  app.style.setProperty('--u', u + 'px');
  app.style.setProperty('--vh', vh + 'px');
  app.style.setProperty('--wh', wh + 'px');
  app.style.setProperty('--vhu', vh / u);
  // fondo: la foto cubre toda la pantalla (y, si se puede, la franja de debajo)
  const s = Math.max(vw / WALL_W, wh / WALL_H), cw = WALL_W * s, ch = WALL_H * s, left = (vw - cw) / 2;
  wall.style.backgroundImage = `url(${ASSETS.wall})`;
  wall.style.backgroundSize = `${cw}px ${ch}px`; wall.style.backgroundPosition = `${left}px 0`;
  const st = document.documentElement.style;
  st.backgroundImage = `url(${ASSETS.wall})`; st.backgroundSize = `${cw}px ${ch}px`; st.backgroundPosition = `${left}px 0`;
  showDebug(vw, vh, wh);
}
function showDebug(vw, vh, wh) {
  if (location.hash !== '#debug') return;
  let d = document.getElementById('dbg');
  if (!d) { d = document.createElement('div'); d.id = 'dbg'; d.style.cssText = 'position:fixed;left:6px;bottom:70px;z-index:99;color:#0f0;font:12px/1.3 monospace;background:rgba(0,0,0,.7);padding:6px;white-space:pre;pointer-events:none'; document.body.appendChild(d); }
  d.textContent = 'inner ' + innerWidth + 'x' + innerHeight + '\nprobe ' + $('#probe').offsetHeight + '\nscreen ' + screen.width + 'x' + screen.height +
    '\nscrollH ' + document.documentElement.scrollHeight + '\nstandalone ' + isStandalone() + '\nusado ' + vw + 'x' + vh + ' (fondo ' + wh + ')\nheal ' + healCount;
}

/* ============ LÓGICA ============ */
let entry = '', secret = null, busy = false;
function press(digit) {
  if (busy || app.classList.contains('unlocked') || entry.length >= CODE_LEN) return;
  entry += digit; if (navigator.vibrate) navigator.vibrate(8);
  renderDots();
  if (entry.length === CODE_LEN) { busy = true; setTimeout(submit, 160); }
}
function submit() {
  if (secret === null) {                       // 1.er intento: falla y se guarda
    secret = entry; dotsBox.classList.add('shake');
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    setTimeout(() => { dotsBox.classList.remove('shake'); entry = ''; renderDots(); busy = false; }, 520);
  } else {                                     // 2.º intento (cualquiera): desbloquea
    DIGIT_APPS.forEach((id, i) => { digitLabels[id].textContent = FORMAT(digitLabels[id].dataset.name, secret[i]); });
    app.classList.add('unlocked'); busy = false;
  }
}
let taps = [];
$('#reset').addEventListener('pointerdown', () => {
  const now = Date.now(); taps = taps.filter(t => now - t < 900).concat(now);
  if (taps.length >= 3) { taps = []; reset(); }
});
function reset() {
  secret = null; entry = ''; busy = false; renderDots();
  Object.values(digitLabels).forEach(l => l.textContent = l.dataset.name);
  app.classList.add('relock'); app.classList.remove('unlocked'); void app.offsetWidth; app.classList.remove('relock');
}

buildHome(); fit();
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 150));
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
addEventListener('load', () => { fit(); [60, 250, 600, 1200].forEach(ms => setTimeout(() => { tryHeal(); fit(); }, ms)); });
addEventListener('pageshow', () => { tryHeal(); fit(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tryHeal(); fit(); } });
addEventListener('pointerdown', () => { tryHeal(); fit(); }, { once: true, passive: true });
addEventListener('scroll', () => { if (window.scrollY !== 0) window.scrollTo(0, 0); }, { passive: true });
addEventListener('keydown', e => { if (/^[0-9]$/.test(e.key)) press(e.key); });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
</script>
