<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Test">
<link rel="manifest" href="test.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Test pantalla</title>
<style>
  html { background: #ff0000; }                 /* lienzo (rojo) */
  body { margin: 0; min-height: 100vh; min-height: 100lvh; background: #ff9900; position: relative; font: 600 13px/1.3 -apple-system, sans-serif; color: #000; }
  .col { box-sizing: border-box; width: 25%; text-align: center; padding-top: 70px; }
  .c1 { position: fixed; left: 0;   top: 0; height: 100lvh;              background: #00c853; }  /* verde: fixed 100lvh */
  .c2 { position: fixed; left: 25%; top: 0; bottom: 0;                    background: #2979ff; }  /* azul: fixed top+bottom 0 */
  .c3 { position: absolute; left: 50%; top: 0; height: 100lvh;            background: #aa00ff; color:#fff; } /* morado: absolute 100lvh */
  .c4 { position: fixed; left: 75%; top: 0; height: -webkit-fill-available; background: #ffeb3b; } /* amarillo: fill-available */
  .end { position: absolute; left: 0; right: 0; bottom: 0; background: #000; color: #fff; padding: 4px 0; font-size: 11px; }
  #info { position: fixed; left: 4px; right: 4px; top: 40%; z-index: 9; background: rgba(0,0,0,.8); color: #0f0; font: 12px/1.35 monospace; padding: 8px; white-space: pre; }
</style>
</head>
<body>
  <div class="col c1">VERDE<br>fixed<br>100lvh<div class="end">FIN verde</div></div>
  <div class="col c2">AZUL<br>fixed<br>top+bottom 0<div class="end">FIN azul</div></div>
  <div class="col c3">MORADO<br>absolute<br>100lvh<div class="end">FIN morado</div></div>
  <div class="col c4">AMARILLO<br>fixed<br>fill-available<div class="end">FIN amarillo</div></div>
  <div id="info"></div>
<script>
function info() {
  const lv = document.createElement('div'); lv.style.cssText = 'position:fixed;height:100lvh;width:1px;visibility:hidden';
  document.body.appendChild(lv);
  const t = 'inner ' + innerWidth + 'x' + innerHeight + '\nclient ' + document.documentElement.clientHeight +
    '\nlvh ' + lv.offsetHeight + '\nscreen ' + screen.width + 'x' + screen.height +
    '\nvisual ' + (visualViewport ? Math.round(visualViewport.height) : '-') +
    '\nscrollH ' + document.documentElement.scrollHeight + '\nstandalone ' + (navigator.standalone === true) +
    '\nColores que llegan al borde de abajo:\nrojo=lienzo naranja=body';
  lv.remove(); document.getElementById('info').textContent = t;
}
info(); addEventListener('resize', info); addEventListener('load', () => setTimeout(info, 400));
</script>
</body>
</html>
